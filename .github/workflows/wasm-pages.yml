name: Validate and package PPSSPP Web

on:
  push:
    branches:
      - ci-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PPSSPP Web
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:5.0.7

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/deps/ppsspp-wasm"

      - name: Verify pinned PPSSPP-WASM revision
        run: |
          expected="$(git ls-tree HEAD deps/ppsspp-wasm | awk '{print $3}')"
          actual="$(git -C deps/ppsspp-wasm rev-parse HEAD)"
          test -n "$expected" && test "$actual" = "$expected"
          echo "Building pinned PPSSPP-WASM revision $actual"

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build ca-certificates git make python3
          cmake --version
          ninja --version
          make --version
          python3 --version
          node --version
          npm --version

      - name: Build release
        run: make wasm-release CMAKE=/usr/bin/cmake WASM_JOBS="-j$(nproc)"

      - name: Install Angular dependencies
        run: npm --prefix wasm-page ci

      - name: Build and verify static Pages package
        run: make app-build-pages

      - name: Save packaged site for later manual deployment
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-site-${{ github.sha }}
          path: wasm-page/dist/ppsspp-web
          if-no-files-found: error
          retention-days: 7
